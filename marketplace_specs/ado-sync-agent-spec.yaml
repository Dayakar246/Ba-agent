openapi: "3.0.0"
info:
  title: "ADO Sync Micro-Agent API"
  version: "1.0.0"
  description: "Independent REST endpoint for the BA Agent Pro ADO Backlog Sync node."
servers:
  - url: "https://ba-agent-aqd8c3d8dtdrbcat.centralus-01.azurewebsites.net"
paths:
  /api/agents/sync-ado:
    post:
      summary: "ADO Backlog Sync Agent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trd_markdown:
                  type: string
                ado_org:
                  type: string
                ado_project:
                  type: string
                ado_token:
                  type: string
      responses:
        '200':
          description: "Sync success and Work Item IDs"
